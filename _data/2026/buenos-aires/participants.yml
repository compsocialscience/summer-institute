- name: Nicolás Elías Amado
  image: /assets/images/20260601_231133 - Nicolas Elias Amado.jpg
  bio: Nicolás Elías Amado is a Ph.D. student in Physics at the Faculty of Mathematics, Astronomy, Physics and Computing (FAMAF), National University of Córdoba, Argentina, where he also received his B.Sc. in Physics. He is a Doctoral Fellow at the National Scientific and Technical Research Council (CONICET) and a recipient of the Simons–Balseiro Exchange Program fellowship. His research focuses on statistical physics, complex systems, sociophysics, and network science, with particular emphasis on opinion dynamics, critical phenomena, and the analysis of complex networks. He has published in international peer-reviewed journals, including Physical Review E and The European Physical Journal B, and has presented his work at numerous national and international conferences.
- name: María Valentina Riganti
  image: /assets/images/SICSS2026_ARG  - Valentina Riganti.jpg
  bio: María Valentina Riganti holds a B.A. and a Teaching Degree in History from the Universidad Nacional del Sur and a Ph.D. in Social Sciences from the Universidad Nacional de Cuyo. She is a postdoctoral fellow at CONICET and a teaching assistant, and is a member of the Centro Interdisciplinario de Estudios de Género y Feminismos (Departamento de Humanidades, Universidad Nacional del Sur) and the Instituto de Investigaciones Económicas y Sociales del Sur (UNS-CONICET). Her research examines how prostitution systems are organized, transformed, and regulated, with a particular focus on the intersections between territories, digital technologies, and public policies from a feminist and socio-historical perspective. In her research, she combines qualitative approaches with computational methods and data science.
- name: Adrián Contursi Reynoso
  image: /assets/images/SICSS2026_ARG - Adrian Contursi-Reynoso.jpg
  bio: Adrián Contursi Reynoso holds a degree in Political Science from the National University of the Littoral (UNL) and is currently completing two master''s degrees: one in Data Mining and Knowledge Management (Austral University) and another in International Integration and Cooperation (CERIR-UNR). He is a Teaching Assistant in Political Geography and Electoral Geography at UNL. He is also an affiliated professor at the Interdisciplinary Laboratory for Computational Social Science (iLCSS) at the University of Maryland and a member of the Community of Practice on Media, Narratives, and Political Communication at the Center on Global Democracy at Cornell University. His research focuses on the intersection of democracy, social networks, and polarization, examining how network structure shapes the spread of disinformation in Latin America, along with multilevel electoral behavior.
- name: Danae Alfonsina Franco Lopera
  image: /assets/images/SICSS2026_ARG  - Danae Alfonsina Franco L..png
  bio: Danae Alfonsina Franco Lopera is an Aeronautical Engineer from the National University of La Plata, with a background in Social Anthropology from the National University of Salta (UNSa). She is a Ph.D. candidate in Renewable Energy at UNSa and a Master's candidate in Sociology and Political Science at FLACSO (Latin American School of Social Sciences). She is a Ph.D. Fellow at the Institute of Research in Non-Conventional Energy (INENCO-UNSa), where she studies the nexus between informal energy access and land tenure in informal settlements through machine learning methods. With over 15 years of experience working directly with informal settlement communities across Latin America, her data science and research work is grounded in that fieldwork, focusing on just energy transition, energy poverty, gender equality, and equitable access to housing and essential services. She previously worked as a Sustainable Energy Research Analyst at UNDP's Sustainable Energy Hub.
- name: Joaquín Zajac
  image: /assets/images/SICSS2026_ARG - Joaquin Zajac.jpg
  bio: Joaquín Zajac is a sociologist, Ph.D. in Social Sciences from the University of Buenos Aires (UBA), and Master in Social Anthropology from the National University of San Martín (UNSAM). He is currently pursuing a Specialization in Computational Social Sciences (UNAB). He is an Assistant Researcher at the National Scientific and Technical Research Council (CONICET) of Argentina, based at EIDAES-UNSAM, where he is a member of the Center for the Study of Violence (NEV) and teaches a seminar on automated data collection with R in the University Diploma in Computational Social Sciences and Digital Humanities. His research focuses on urban violence, security, and juvenile criminal justice in the Buenos Aires metropolitan area, and also explores possible applications of computational methods and Natural Language Processing techniques in the Social Sciences.
- name: Santiago De Villalobos
  image: /assets/images/SICSS2026_ARG - Santiago De Villalobos.jpeg
  bio: Santiago De Villalobos is a sociologist and holds a Master’s degree in Social Science Research from the University of Buenos Aires (UBA). He is also a lecturer at the university and a doctoral fellow at the National Scientific and Technical Research Council (CONICET). Based at the Gino Germani Research Institute (IIGG-UBA), his research focuses on the structure of social classes and their relationship with digital inequalities.
- name: Franco Cellone
  image: /assets/images/SICSS2026_ARG  - Franco Eduardo Cellone.jpeg
  bio: Franco Cellone is a psychologist and Ph.D. candidate in Semiotics at the National University of Córdoba (Argentina). His research focuses on digital discourses about gender, sexuality, and queer identities, particularly on how these circulate and are disputed on social media platforms. His work combines semiotics, discourse analysis, and computational social science, with an emphasis on Natural Language Processing, social network analysis, and large-scale digital corpora. He is a doctoral fellow at the Center for Advanced Studies (CEA-UNC) and has been a visiting researcher at Lab CORES (Federal University of Rio de Janeiro) through the CAPES Move La América program. He teaches computational methods for social research at the National University of Córdoba and data science for social sciences and public management at the Catholic University of Córdoba.
- name: Candela Morales
  image: /assets/images/SICSS2026_ARG - Candela Morales.jpg
  bio: BA in Psychology. Doctoral Fellow co-funded by UAI–CONICET at Universidad Abierta Interamericana, within the Sexual and Reproductive Health Research Group (GISSER). I teach courses in research methodology, neuroscience, and neurophysiology. My research examines the relationship between sexual health knowledge and self-care behaviors in light of epidemiological data on sexually transmitted infections (STIs). Our work integrates data science approaches with advanced statistical analyses.
- name: Marcos Buccellato
  image: /assets/images/SICSS2026_ARG  - Marcos Gilberto Buccellato.jpg
  bio: Marcos Buccellato combines more than 20 years of experience in IT and software development with an academic background in social sciences and data science. He currently leads R&D+i in a retail group and Circular Innova (coworking space, laboratory, and incubator), and is co-founder of a consultancy specializing in applied social science research and data science, where he leads research teams, GIS systems, and statistical analysis. He was previously CEO of CytoEM Innovations, a biotechnology startup. He holds a degree in Social Anthropology, a Diploma in Computational Social Sciences, is pursuing a Master's degree in Data Science at Universidad Austral, and a Ph.D. in Sociology at UNSAM, where he researches private investment groups. In teaching, he is an Adjunct Professor of Machine Learning at Universidad Nacional del Delta and a Teaching Assistant in Anthropological Theory I at UNSAM.
- name: Juana Rodriguez Gallo
  image: /assets/images/SICSS2026_ARG  - Juana Rodriguez Gallo.jpeg
  bio: Juana Rodriguez Gallo is a Ph.D. student in Physics at the University of Buenos Aires, with a doctoral fellowship from the National Scientific and Technical Research Council (CONICET) of Argentina. She conducts her research at the Sophy Lab, where she studies the dynamics of information diffusion and opinion formation in online social networks from a complex systems perspective, combining natural language processing, large language models, network science, and statistical-mechanical modeling.
- name: Gabriel Díaz Nanni
  image: /assets/images/SICSS2026_ARG - - Gabriel Leonardo Díaz Nanni.JPG
  bio: Gabriel Díaz Nanni is a doctoral candidate in Political Science at the School of Politics and Government, National University of San Martín (UNSAM), Argentina. He also holds a Diploma in Computational Social Sciences and Digital Humanities from EIDAES-UNSAM. His research focuses on subnational politics, political parties, and political change in Latin America. He is currently developing his doctoral dissertation on the emergence and persistence of conservative parties at the provincial level in Argentina. He also participates in research projects on political communication, applying computational methods to study political discourse and media coverage. His methodological interests include quantitative methods, comparative research designs, and the use of computational approaches for data collection, processing, and analysis in the social sciences.
- name: Anabella Abarzúa Cutroni
  image: /assets/images/SICSS2026_ARG  - Anabella Abarzúa Cutroni.png
  bio: Anabella Abarzúa Cutroni is a political scientist with a Ph.D. in Social Sciences from the University of Buenos Aires. She is an Adjunct Researcher at the National Scientific and Technical Research Council (CONICET) of Argentina and teaches research methodology at the National University of Cuyo. Her research focuses on the epistemological and historical conjunction of machine learning, statistics, and computing architectures in the development of contemporary Artificial Intelligence.
- name: Agustín Nielsen
  image: /assets/images/SICSS2026_ARG  - Agustín Nielsen.jpg
  bio: Agustín Nielsen is a senior undergraduate student in Sociology at the University of Buenos Aires (UBA), with a concentration in Digital Technologies and Society. He is a research assistant at the Gino Germani Research Institute (IIGG-UBA) and serves as an undergraduate teaching assistant for the course "Internet and Society". His research focuses on sociality and digital platforms. Within the field of Computational Social Sciences, his current work applies Natural Language Processing (NLP) techniques to analyze affective polarization on digital platforms in Argentina.
- name: Bautista Salvatierra
  image: /assets/images/SICSS2026_ARG  - bautista salvatierra.jpg
  bio: Bautista Salvatierra Pérez is a physicist from the Universidad de Buenos Aires, currently completing his undergraduate thesis on media bias and polarization, applying Natural Language Processing techniques (BERTopic, embeddings, topic modeling) and a statistical mechanics latent space model to infer ideological bias from social media content. He is also pursuing a BSc in Data Science at UBA. He currently works as a Data Scientist at Rappi, where he develops machine learning models for payment recovery and user segmentation. His research interests lie at the intersection of computational social science, NLP, and statistical physics.
- name: Julieta Guerrisi
  image: /assets/images/SICSS2026_ARG - Julieta Guerrisi.jpeg
  bio: Julieta Guerrisi is a sociologist, with a Bachelor's degree in Sociology from the National University of San Martín (UNSAM), and is currently pursuing a Master's degree in Generation and Analysis of Statistical Information at the National University of Tres de Febrero (UNTREF). She works at the Academic and Internationalization Secretariat of UNSAM, where she conducts research on the impact of student policies, from methodological design to the publication of results, providing evidence for institutional decision-making.
- name: Alexander Benites Alvarado
  image: /assets/images/SICSS2026_ARG - Alexander Benites.png
  bio: Alexander Benites is a data scientist and political scientist. He holds an MSc in Data Science with Distinction from the University of Manchester and a BA in Political Science from the Pontificia Universidad Católica del Perú (PUCP). He is a researcher at Peru's Oficina Nacional de Procesos Electorales (ONPE) and a professor of quantitative methods at the Universidad Peruana de Ciencias Aplicadas (UPC). He has worked as a quantitative researcher for public and private institutions, as well as for multilateral organizations. His work combines statistical modeling and machine learning to understand social and political processes, with a focus on electoral management, democratic institutions, information integrity, and the use of quantitative evidence to inform public decision-making.
- name: Verónica Herrero Zamora
  image: /assets/images/SICSS2026_ARG  - Verónica Herrero.jpg
  bio: Verónica Herrero Zamora holds a Bachelor's degree in Economics, a Master's degree, and a Ph.D. in Demography from the Universidad Nacional de Córdoba (Argentina). She is an undergraduate and postgraduate professor, as well as a research project director at Universidad Siglo 21. Her research projects focus on topics related to population, the labor market, and education, among other social issues, primarily applying quantitative methodologies.
- name: Bárbara Estévez Leston
  image: /assets/images/SICSS2026_ARG  - Bárbara Estévez Leston.jpeg
  bio: Bárbara Estévez Leston is a sociologist with a Ph.D. in Social Sciences and a Master's degree in Social Research from the University of Buenos Aires. She works at the National Statistics Office of Argentina (INDEC) and is part of a research program on inequalities and social structure at the Instituto de Investigaciones Gino Germani (PIClases). She also teaches statistics and methodology courses at several national universities. Her research focuses on neighborhood effects over the life course.
- name: Mariano García Migliore
  image: /assets/images/SICSS2026_ARG  - Mariano Garcia Migliore.jpg
  bio: Mariano García Migliore is a sociologist (University of Buenos Aires, 2018) with a strong orientation toward data analysis and applied research. He currently works as Senior Specialist in Diagnosis and Measurement at the General Directorate of Organizational Culture of the Buenos Aires City Ministry of Health, within a health system digitalization project funded by the Inter-American Development Bank, where he designs measurement instruments, leads field surveys, and develops dashboards and data visualizations for strategic decision-making. He holds a Diploma in Data Analysis and Public Policy (UBA, 2024) and is completing a Diploma in Health Data Analysis (National University of Lanús). He is also a Master's candidate in Human Development at FLACSO Argentina. His work sits at the intersection of social research methods and data analytics, combining Python, R, SQL, and Power BI to transform complex datasets into actionable insights across organizational and public health contexts.
- name: Andrea Gomez Vargas
  image: /assets/images/SICSS2026_ARG  - Andrea Gomez Vargas.jpg
  bio: Andrea Gómez Vargas is a sociologist and data analyst specializing in official statistics, population studies, and open science. She is currently pursuing a Master's degree in the Generation and Analysis of Statistical Information at the National University of Tres de Febrero (UNTREF), Argentina. Her work focuses on reproducible data analysis, open-source tools, and expanding access to public data through R packages and interactive applications. She is an active contributor to the R community through R in Buenos Aires, R-Ladies+, LatinR, and rOpenSci.
- name: Felipe Ruiz
  image: /assets/images/SICSS2026_ARG - Felipe Stefano Ruiz Bruzzone.png
  bio: Felipe Ruiz is a sociologist (Universidad de Chile) and has specialized professionally in the field of Data Science. In parallel, he has pursued an academic career. He holds a PhD in Social Sciences from Universidad de Chile, funded by Chile's National Agency for Research and Development (ANID, 2021–2025). In 2019, he completed his Master's degree in Social Sciences at Universidad de Chile. He is actively engaged in public debate as a researcher at Fundación Nodo XXI. He is also Executive Director (CEO) of Estrategia Sur, a data science consultancy for strategic decision-making.
- name: Maria Silvia Tomas
  image: /assets/images/SICSS2026_ARG  - Silvia Tomas.png
  bio: My name is María Silvia Tomás. I have a degree in Social Sciences from the National University of Quilmes and a postgraduate diploma in Data Science from Arturo Jauretche University. I am currently finishing my Master's degree in Data Science at that university. I am the director of social statistics at the Provincial Directorate of Statistics of the province of Buenos Aires. I work on integrating statistical and administrative records from various government sources in order to improve and complete statistical information.
- name: Lucas Klobovs
  image: /assets/images/SICSS2026_ARG  - Lucas Klobovs.png
  bio: Lucas Klobovs is a political consultant and public opinion researcher with over 15 years of experience measuring and predicting public opinion across Latin America. He holds a degree in Political Science from the Universidad Católica Argentina and a Master in Generation and Analysis of Statistical Information from the National University of Tres de Febrero (UNTREF). He is Director of Public Opinion at QSocial and methodological advisor to the Humanitarian Observatory of the Argentine Red Cross. He coordinates the Master's Program in Generation and Analysis of Statistical Information at UNTREF, where he also teaches. He is a member of WAPOR Latinoamérica and has presented research at international conferences and published in peer-reviewed journals. His work focuses on electoral behavior, government approval, and public image, designing quantitative and qualitative research that supports decision-making for governments, political parties, investment funds, and international organizations operating in Latin America.
- name: Emilio Recart Zapata
  image: /assets/images/SICSS2026_ARG  - Emilio Recart.jpg
  bio: Emilio Recart is a Ph.D. candidate in Social and Cognitive Neuroscience at Adolfo Ibáñez University, Chile. He holds a Bachelor's degree in Psychology from the University of Buenos Aires and has postgraduate training in Data Science, Cognitive Neuroscience, and Biostatistics. His research lies at the intersection of computational neuroscience and computational neurophenomenology, integrating machine learning, multimodal neurophysiological recordings, and first-person reports to model the relationship between brain dynamics and subjective experience. His current work focuses on developing computational approaches to characterize neurophenomenological states related to social cognition, empathy, and altered states of consciousness.
- name: José Conrado Marcantonio
  image: /assets/images/SICSS2026_ARG - José Marcantonio.png
  bio: José Conrado Marcantonio is a sociologist and M.A. candidate in the Generation and Analysis of Statistical Information program at the National University of Tres de Febrero (UNTREF), Argentina. He works as a Data Analyst at the Directorate of Statistics of the Province of Buenos Aires, where he analyzes census, survey, and administrative data using R, Python, and MySQL to support evidence-based public policies. He is also a researcher at the Institute for Research in Humanities and Social Sciences (IDIHCS, CONICET–National University of La Plata), where he studies demographic change, migration, and social inequalities using quantitative and computational methods. His research interests include computational social science, demographic analysis, machine learning for social research, and the application of data science methods to public policy and official statistics.
- name: María de la Paz Aquino
  image: /assets/images/SICSS2026_ARG  - Maria de la Paz Aquino.jpg
  bio: María de la Paz Aquino is a sociologist from the University of Buenos Aires. She is currently pursuing a Specialization in Public Policy Evaluation at the National University of San Martín and has postgraduate training in public policy, data analysis, and computational social science. Her professional experience is mainly in the evaluation of public education policies, participating in the design and implementation of evaluation and monitoring processes, as well as in information analysis for decision-making. She has also participated in consulting projects in data analysis and applied research.
- name: Malena Saguier
  image: /assets/images/SICSS2026_ARG  - Malena Saguier.jpg
  bio: Malena Saguier is a sociologist, holds a Master's degree in the Design and Management of Social Programs from the Latin American Faculty of Social Sciences (FLACSO), and is a Specialist in Data Science from the Buenos Aires Institute of Technology (ITBA). She works at the Ministry of Education of the City of Buenos Aires, where she coordinates the Data Analytics team within the Program and Policy Evaluation Unit of the Comprehensive Unit for Educational Quality and Equity Evaluation (UEICEE). She also teaches at the University of Buenos Aires, where she lectures on social policy planning and social research methodologies. Her work focuses on the evaluation of educational policies, data analysis, and data visualization to support evidence-informed decision-making. She is currently interested in Computational Social Science and its applications to research and public policy evaluation.
