- name: "Prof Nathan Mathias." # Speaker name goes here.
  image: /assets/images/Nathan.jpg   # Upload speaker image to /assets/images/ and update URL here.
  bio: "Dr. J. Nathan Matias is an Assistant Professor in the Department of Communication and a Field Member in Information Science at Cornell University. He is the founder and director of the Citizens and Technology (CAT) Lab, where he leads interdisciplinary research on technology, artificial intelligence, and society, with a focus on promoting safer, fairer, and more inclusive online communities. His work combines computer science, social science, and public-interest research to address challenges such as online harassment, misinformation, political polarization, and algorithmic accountability. Nathan is also a co-founder of the Coalition for Independent Technology Research, advancing independent research on the societal impacts of digital technologies. He earned his PhD from the MIT Media Lab and MIT Center for Civic Media and has held research appointments at Stanford University, Columbia University, Princeton University, and Harvard University. His research and public engagement have earned numerous international awards, including the Mozilla Rise25 Award, and his work has been featured in leading academic journals and global media outlets." # add speaker bio here

- name: "Prof. Bastian Greshake Tzovaras." # Speaker name goes here.
  image: /assets/images/Bastian.jpg   # Upload speaker image to /assets/images/ and update URL here.
  bio: " Bastian Greshake Tzovaras is a researcher who works on the theory and practice of co-creating knowledge through citizen science and peer production. Overall, his research centers around how open source/science technologies can be used to empower individuals and communities to engage in their own knowledge production. He does so by bringing together applied and theoretical methods from computer/data science,human-computer-interaction and critical science & technology studies. He currently works with the Citizen and Technology Lab and before held posts at The Alan Turing Institute in London and the French National Institute of Health and Medical Research. Before turning towards collaborative knowledge creation, he started his research career as abiologist, getting a PhD in bioinformatics from the Goethe University in Frankfurt, Germany, applying statistical methods to large-scale genetic data." # add speaker bio here
  website: https://www.google.com # update speaker personal link here

- name: "Winnie Kabintie." # Speaker name goes here.
  image: /assets/images/Winnie.jpeg   # Upload speaker image to /assets/images/ and update URL here.
  bio: " Winnie Kabintie is a Strategic Communications Specialist and open knowledge advocate working at the intersection of digital rights, information access, media, and emerging technologies in Africa. With over a decade of experience in media and information literacy, communications, and community building, she has become a leading voice on digital inclusion, knowledge equity, information integrity, and the role of open digital ecosystems in shaping African narratives. " # add speaker bio here

- name: "Terry Boke." # Speaker name goes here.
  image: /assets/images/Terry.jpg   # Upload speaker image to /assets/images/ and update URL here.
  bio: " Terry Boke is a Media and Communications Specialist based in Kenya, with over a decade of experience in impactful storytelling to amplify brand narratives and champion social causes. Her expertise spans human rights advocacy, gender equality, education, and digital literacy. Beyond digital activism, Teresia is committed to hands-on community engagements, working directly with marginalized groups in Kenya to drive sustainable empowerment. Since joining the Wikimedia movement in 2020, Terry actively contributes to Wikipedia, Wikimedia Commons, Wikidata, and WikiQuotes. As a core member of the Wikimedia Kenya User Group, she volunteers her expertise in PR, media relations, and campaign organizing. She has coordinated campaigns such as Art & Feminism (2023, 2024 & 2025), Wikipedia@25 among others. For Terry, contributing to global knowledge is a reciprocal journey of learning and mentorship. Her active involvement in both local, regional and international networks enriches her professional development and strengthens her resolve to build a more informed, equitable digital world.  " # add speaker bio here

- name: "Carol Mwaura." # Speaker name goes here.
  image: /assets/images/Carol.jpeg   # Upload speaker image to /assets/images/ and update URL here.
  bio: " Carol Mwaura is a librarian, knowledge equity advocate, and community leader with a decade experience in library and information services, community engagement, and open knowledge initiatives. She serves as the Library Manager in a community library and  is a founding member and Co-lead of the Wikimedia Community User Group Kenya. Through her work with Wikimedia and libraries, she has championed initiatives focused on bridging knowledge gaps, increasing the representation of African content online, promoting digital literacy, preserving local knowledge, and advancing gender equity on the internet. Carol has led and supported numerous community-driven projects across Africa and globally, including campaigns on open knowledge, information access, and sustainable development. She is passionate about leveraging libraries, technology, and collaborative communities to expand access to knowledge and create inclusive opportunities for learning and participation. " # add speaker bio here

- name: "John Mutinda PhD Candidate." # Speaker name goes here.
  image: /assets/images/Mutinda.jpeg   # Upload speaker image to /assets/images/ and update URL here.
  bio: " John Kamwele Mutinda is a third-year doctoral candidate in Statistics at the School of Management, Department of Statistics and Finance, University of Science and Technology of China, where his research focuses on innovative hybrid machine and deep learning models for time series analysis. He holds two Master's degrees: a Master's in Machine Intelligence from the African Institute for Mathematical Sciences in Senegal, awarded with distinction, and a Master's in Mathematical Sciences from AIMS Rwanda, also with distinction. He completed his Bachelor of Science in Statistics with First Class Honours from South Eastern Kenya University. He has been the recipient of several prestigious awards, including the Full PhD Scholarship from the University of Science and Technology of China, the AMMI Scholarship funded by Facebook and Google, and the Next Einstein Fellowship Master's Scholarship. Additionally, he holds a Certificate in Business Administration from the European School of Management and Technology in Berlin, Germany. John has published over 25 peer-reviewed papers in reputable international journals including Expert Systems with Applications, Computational Economics, Scientific African, and the Journal of Applied Mathematics. He serves as a key peer reviewer for more than 50 international academic journals across machine learning, statistics, and applied sciences. His research interests span linear, nonlinear, and interval time series analysis, feature selection, machine learning, deep learning, large language models, and agentic artificial intelligence. His work consistently emphasizes methodological rigor, cross-domain applicability, and the integration of explainable AI to bridge predictive modeling with real-world decision-making across the natural, social, and life sciences. " # add speaker bio here
  
