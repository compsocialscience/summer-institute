- name: "Lebu Ayiga."
  image: /assets/images/placeholderPic.png
  bio: "Lebu Ayiga is a software engineer and a community organizer with Wikimedia Kenya User Group, where he contributes his technical expertise and organizational leadership to advance the movement's strategic goals. Lebu is deeply involved in initiatives aimed at closing digital and gender gaps on Wikimedia platforms and promoting equitable access to information, strengthening the local knowledge ecosystem, and empower the next generation of open knowledge contributors."
  website: www.google.com

- name: "Samuel Kipsang Kaptum."
  image: /assets/images/Kaptum.png
  bio: "Samuel Kaptum is an emerging scholar and educator in the field of Mathematical sciences, specializing in Financial Mathematics and behavioral finance. He holds a Master of Science in Mathematics (Financial Option) at the Pan African University Institute for Basic Sciences, Technology and Innovation (PAUISTI), where his research explores modeling herd behavior in financial markets an area at the intersection of psychology, economics, and quantitative analysis. He also holds a Master of Science in Mathematical Sciences from the African Institute for Mathematical Sciences (AIMS), a Pan-African center of excellence for advanced Mathematical training and research. His academic foundation began with a Bachelor of Science in Mathematics from the University of Nairobi. With a passion for teaching and applied research, Samuel is lecturing applied Mathematics and Statistics at Jomo Kenyatta University of Agriculture and Technology (JKUAT) and NIBS Technical College. He is committed to interdisciplinary collaboration, mentoring the next generation of scholars, and solving real-world financial challenges through data-driven analysis."
  website: www.google.com
