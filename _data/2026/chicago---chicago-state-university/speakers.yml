- name: Danye Medhin
  image: /assets/images/medhinphoto.jpg
  bio: "Danye Medhin is an Assistant Professor of Criminal Justice at Bethune Cookman University and a policy analyst specializing in drug policy and criminal justice reform. He earned his PhD in Criminology from Georgia State University. His research blends casual inference and policy analytics, with a focus on how legal changes shape patterns of enforcement and inequality. Danye works extensively with large scale administrative datasets, including the FBI’s National Incident Based Reporting System (NIBRS) and the Uniform Crime Reports (UCR). His current work applies multiple imputation on a massive scale to address item level missingness in NIBRS, substantially improving its usability for policy analysis. Ultimately, this work will support a broader research agenda aimed at estimating the causal effects of cannabis legalization and related policies on arrest patterns across demographic groups. Outside of his academic work, Danye is an avid NBA 2K player, where he and his son lead a highly competitive crew."
  website: https://www.linkedin.com/in/danye-medhin-ph-d-9655488b/

- name: Erin M. Ochoa
  image: /assets/images/csu_erin.png
  bio: "Erin is a Ph.D. candidate in sociology at Northwestern University and a graduate research fellow at the Center for Neighborhood Engaged Research and Science (Corners).  Implementing computational and quantitative methods, her work focuses on evaluating community violence intervention programs.  Erin was formerly a graduate research fellow at the Center for Spatial Data Science and was previously with the New Mexico Sentencing Commission and the New Mexico Statistical Analysis Center.  She holds a Master’s in sociology from Northwestern University, a Master’s in Computational Social Science from the University of Chicago, and a Bachelor’s in criminology from the University of New Mexico. Erin is also an alum of SICSS Chicago, serving as the teaching assistant for SICSS Chicago in 2021."

- name: Félix Morales
  image: /assets/images/csu_morales.png
  bio: "After working in microfluidics and tissue engineering, I decided to get busier with computers and data. As such, I was a student in the Quantitative and Systems Biology master’s program at Northwestern University, working in the Amaral Lab on clustering clinical courses of severe pneumonia patients using their electronic health records and integrating those records with the Human Phenotype Ontology. I have since returned to Northwestern as a research specialist in the Amaral Lab."

- name: Scott Daniel
  image: /assets/images/csu_daniel.png
  bio: "Scott Daniel is the senior software engineer at the SCALES-OKN, a data transparency non-profit focused on making court data more accessible and analyzable. He is also an accomplished touring musician and artist."
