  bio: "Sarthak Ingle is a Pre-Doctoral Researcher at the National University of Singapore (NUS). He completed his B.E. in Computer Science at BITS Pilani. His research interests include machine learning, artificial intelligence, computational social science, and large language models, with a focus on developing data-driven methods to better understand human behaviour and societal systems."
