- name: Dr. Moses Udoisoh (PhD)
  image: /assets/images/Moses Udoisoh2.jpg  
  bio: "<p align='justify'>Moses Udoisoh PhD is a seasoned Physicist and Thermofluids Engineer trained in Nigeria and Australia. He holds degrees in Mechanical Engineering, Electrical/Electronics Engineering and Physics. He is fast becoming the first Researcher in Molecular and Medicinal Biophysics in the Nigerian state. He recently led a team of Scientist to discover the Stokes-Induced Stark Effect (SISE), as a potential solution for several interfacial interaction issues like Chronic diabetic foot ulcers. As a Scientist with theoretical and computational approaches, he applies the concepts of Quantum and Molecular Mechanics to physical problems in biological spaces. <br> He is the Author of Fundamentals of University Physics and the Lead Scientist at Gamma Data Analytics and Computation.</p>"
  website: https://www.linkedin.com/in/moses-udoisoh-619b921a8/

- name: J. Nathan Matias (Wiki in Africa)
  image: /assets/images/Nathan SICSS Nigeria.JPG
  bio: "<p align='justify'>Dr. <a href='https://natematias.com' target='_blank'>J. Nathan Matias</a>  is a computer scientist and social scientist who organizes citizen behavioral science for a safer, fairer, more understanding Internet. A Guatemalan-American, Nathan is founder of the Citizens and Technology Lab, an assistant professor in the Cornell University Department of Communication, and field member in Information Science. <br> Nathan is founder of the <a href='https://citizensandtech.org/' target='_blank'>Citizens and Technology Lab</a>, a public-interest research group at Cornell that organizes citizen behavioral science and behavioral consumer protection research for digital life. CAT Lab has worked with communities of tens of millions of people on reddit, Wikipedia, and Twitter to test ideas for preventing harassment, broadening gender diversity on social media, responding to human/algorithmic misinformation, managing political conflict, and auditing social technologies. <br>Nathan is also a pioneer in industry-independent evaluations on the impact of social technologies and artificial intelligence in society. Toward this end, he co-founded the <a href='https://natematias.com/bio/independenttechresearch.org/' target='_blank'>Coalition for Independent Technology Research</a>, a nonprofit that supports and defends independent research on technology and society.</p>"
  website: https://natematias.com

- name: Bastian Greshake Tzovaras (Wiki in Africa)
  image: /assets/images/Bastian Photo.jpg
  bio: "<p align='justify'> <a href='https://https://tzovar.as/' target='_blank'>Bastian</a> (he/him) is an interdisciplinary researcher working on the theory and practice of co-created participatory science and peer production. His work intersects with open source/science technologies and how they can be in service of individuals & communities that want to engage in knowledge production, bringing together applied and theoretical methods from computer/data science, human-computer-interaction and critical science & technology studies.<br>Bastian’s prior academic postings include being a senior researcher at the Alan Turing Institute in London and being the team-lead of the Peer-Produced Research Lab as part of an INSERM unit at Université Paris Cité. His academic journey started in biology/bioinformatics, with a PhD on how symbiotic relationships influence genomic evolution.<br>In the realm of participatory science, he was the co-founder and lead of openSNP, a crowdsourced/citizen science open data project that ran between 2011-2025. Since 2017, he also acts as the Director of Research for Open Humans – a non-profit that provides digital & social infrastructures for individual & community-driven citizen science and self-research.</p>"
  website: https://tzovar.as/

