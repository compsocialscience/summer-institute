- name: Joseph David
  image: /assets/images/Joseph David.jpg
  bio: "<p align='justify'>Joseph David is a Research Associate at Preston Consults, Abuja. His research sits at the intersection of public finance, and the political economy of corruption, money laundering, and the underground economy in resource-rich developing economies. His current work examines how institutional and political factors, such as corruption and political affiliation, shape the economic efficiency of intergovernmental fiscal transfers in transfer-dependent subnational units of a resource-rich economy. Joseph applies computational social science methods to a range of applied research questions. He is an alumnus of SICSS, having participated in SICSS-Covenant 2022.</p>"
  website: https://SmallJosePhD.github.io

- name: Hanson Johnson 
  image: /assets/images/Hanson Johnson.png
  bio: "<p align='justify'>Hanson Johnson is a registered Engineer and a distinguished leader in the Nigerian technology and innovation ecosystem, currently serving as the Chairman of ISN and the Chairman of the Startup Consultative Forum. A pioneer in digital transformation, he is the CEO of Start Innovation Hub and President of Ibom Innovation Network, organizations dedicated to fostering entrepreneurship and technical talent development. In recognition of his significant impact, Mr. Johnson was honored with the Akwa Ibom State Productivity Order of Merit Award in ICT in September 2022. He is a committed advocate for leveraging technology to drive economic growth and productivity across the continent.</p>"
  website: https://www.linkedin.com/in/nextdeegit/

- name: Dr. Akaninyene Mark , (MBBch, MPH, SRF,  FWACP, PhD)
  image: /assets/images/Dr. Akaninyene Mark.jpg
  bio: "<p align='justify'>Dr. Akaninyene Mark is an outstanding Consultant Physician in Public Health, Planning Research, Statistics and Community Medicine. He is an Associate Fellow National Postgraduates Medical College. Dr. Mark is a distinguished scholar, researcher, and mentor, serving in various capacities including Senior Research Fellow and Director/Dean of the Afromed Academy of Medical Research, ICT and Innovation, Zambia. He is the Editor-in-Chief of the Frontline Professionals Journal (FPJ); and associate Fellow/ Reviewer Science Publishing group, Visiting Adjunct Senior Consultant at Somacas Medical Center, Ghana. <br> He is academic giant and thorough-bred mentor, he has supervised and continues to inspire postgraduate in Nigeria and Master’s students across Nigeria and Africa. <br> His dedication to health planning, research, ethics, and community medicine has left indelible marks on the practice of medicine and beyond. <br> He is currently the Deputy Director Health Planning Research and Statistics in the Akwa ibom state Ministry of Health Uyo and a consultant par excellence.</p>"
  website: https://www.linkedin.com/in/akaninyene-mark-69a4032a2/ 

- name: George Odo 
  image: /assets/images/George Odo2.jpg 
  bio: "<p align='justify'>George is a computer science graduate of the University of Calabar. He is a web and Machine Learning model developer, verse in programming languages such as Python, R, React, React Native, TypeScript, and JavaScript. <br> George has been able to gather wealth of experiences as a full stack web developer and data scientist at Zoe-Sprout Technologies International. He is particularly drawn to the power of data science, and he enjoys exploring how data can be leveraged to drive innovation and solve complex problems. As he continues to grow in the field of computer science, he is eager to apply his skills in real-world projects, where he can share his knowledge with others while continuing to learn and improve. <br>He enjoys collaborating with teams to build innovative solutions and create impactful digital experiences</p>"
  website: https://www.linkedin.com/in/odo-george-21920b378/

- name: Hilary Onuh Ogali (Wikimedia Nigeria)
  image: /assets/images/Wiki Nig Hilary Ogali.jpg
  bio: "<p align='justify'>Hilary Ogali is a civil engineer, project manager, and open knowledge enthusiast who joined the Wikimedia movement in 2022 as a volunteer editor. He currently serves as the Project Manager for Wiki In Africa's Wiki Loves Africa media campaign and is a member of the Wiki Loves Monuments International (WLM-i) team. Hilary also leads the Igbo Wikimedians Commons Hub as Community Lead, serves as Programs Manager for the Igala Wikimedia Community, and is a member of the Programs Team of the Igbo Wikimedians User Group. Passionate about open knowledge, Wikimedia Commons, and community development, he works with volunteers and communities across Africa to strengthen participation in Wikimedia projects, promote the documentation of African culture and heritage, and support the growth of sustainable Wikimedia communities.</p>"
  website: https://www.wikiinafrica.org/people-of/hilary-ogali/

- name: Chinonso Chidi (Wikimedia Nigeria)
  image: /assets/images/WikiNig Chinonso Chidi.PNG
  bio: "<p align='justify'>Chinonso Chidi is a biomedical scientist, researcher, and open knowledge enthusiast. He joined the Wikimedia movement in 2020, now a Wikipedia administrator, and Projects/Programs Manager for Wikimedia Projects. He’s also on the Wiki Loves Monuments International (WLM-i) team, and a Wiki Loves Africa 2026 Ambassador. In 2025, he was Wikimedian-in-Residence at Code for Africa’s African Wikipedian Alliance, leading the Inclusion and Climate Justice project which focused on closing content gaps on Wikipedia and its sister projects on core topics relating to gender equity and climate awareness in Southern Africa.</p>"
  website: https://meta.wikimedia.org/wiki/User:King_ChristLike

- name: Andikan Eduok (Wikimedia Nigeria)
  image: /assets/images/Wiki Nig Andikan Eduok.jpg 
  bio: "<p align='justify'>Andikan Eduok is a graphic designer, Community and Social Media Manager, and Wikimedian passionate about open knowledge, digital inclusion, and community building. <br>She is the Founder and Lead of the Wikimedia User Group Nigeria – Akwa Ibom Network, where she leads initiatives that promote knowledge equity and strengthen Wikimedia communities in Nigeria. She holds a Bachelor of Science degree in Pure and Industrial Chemistry from the University of Nigeria, Nsukka. She served as a Wikimedian-in-Residence with Code for Africa's African Wikipedian Alliance, where she led the EmpowerHer project, an initiative focused on closing the gender gap and increasing the visibility of African women on Wikipedia and Wikidata. The project supported efforts to bridge content gaps by documenting the achievements of women across sectors, with particular emphasis on underrepresented regions including the Sahel, neighbouring West Africa, and the Horn of Africa. <br>Andikan is a past Africa Wiki Women Fellow. She later served as the Administrative Co-Lead for Africa Wiki Women, supporting the growth and coordination of the continental community.<br>Through her work, she empowers communities to contribute to open knowledge, preserve language, cultural heritage, and leverage technology for social impact through collaboration, capacity building, and digital knowledge initiatives.</p>"
  website: https://meta.wikimedia.org/wiki/User:Andikan_Efiok_Eduok
