- name: Dr. Bianca Uzoamaka Mbonu-Adigwe # Participant Name
  image: /assets/images/1 DR. BIANCA UZOAMAKA MBONU-ADIGWE.png
  bio: "Dr. Bianca Uzoamaka Mbonu-Adigwe is a Lecturer in Science Education at the University of Nigeria, Nsukka, with expertise in technology-integrated learning, teacher education, and inclusive teaching practices. She is passionate about mentoring educators and young leaders, having founded platforms that provide mentorship and practical learning opportunities across Africa. Through her volunteer initiatives, she has supported over 3,000 girls in rural communities with books and hygiene products. Bianca is a Visiting Research Assistant with IEEE, University of Chichester, UK, and has completed professional training with institutions including the University of Colorado Boulder, DAAD, Michigan State University, and Universiti Teknologi Malaysia."
  website: https://sicss.io/2026/uyo/people  

- name: Emmanuel Elikplim  # Participant Name
  image: /assets/images/2 Emmanuel Elikplim.png 
  bio: "Emmanuel Elikplim is an early-career researcher and accounting professional based in Ilorin, Nigeria, affiliated with the University of Ilorin and Abel Aiyedogbon & Co. (Chartered Accountants). As a Charter Member of the Association of Ranking Professionals (ARP), his research interests lie at the intersection of corporate governance, institutional performance, and data-driven transparency. He specializes in evaluating board characteristics and corporate social responsibility (CSR) disclosures. As an upcoming researcher, he is building his skills in research and data analysis to enhance empirical research."
  website: https://sicss.io/2026/uyo/people 

- name: "Nyitse Daniel" # Participant Name
  image: /assets/images/3 Nyitse Daniel.jpg 
  bio: "Nyitse Daniel is a lecturer in the Department of Linguistics at the Nigeria French Language Village (Inter-University Centre for French Studies), Lagos, Nigeria. He is currently a PhD student at the University of Ilorin, Kwara State, Nigeria. His research in contrastive linguistics examines the pedagogical exigencies of the structural and functional values of pronouns in French and Tiv. His academic interests also extend to semantics and semiotics, areas in which he has published several scholarly articles. In addition, he is the contributor and legal owner of Tiv language datasets on the Mozilla Data Collective (MDC)."
  website: https://sicss.io/2026/uyo/people  

- name: Dr. Osakpolo Igbinovia  # Participant Name
  image: /assets/images/4 Dr. Osakpolo Igbinovia .png 
  bio: "Dr. Osakpolo Igbinovia is a lecturer and researcher at Ambrose Alli University, where she contributes to the fields of French studies, translation, and literary scholarship. Her research interests centre on translation studies, African Francophone literature, feminist and postcolonial approaches to translation, self-translation, and intercultural communication. She is particularly interested in how language, culture, identity, and power relations shape the production and reception of translated texts within African literary contexts."
  website: https://sicss.io/2026/uyo/people  

- name: Ademola, Mutiu # Participant Name
  image: /assets/images/5 Ademola, Mutiu.png
  bio: "I am an administrative professional and emerging researcher at the Directorate of Academic Planning, Federal University Oye-Ekiti (FUOYE), Nigeria. My work sits at the intersection of scientific and strategic management, corporate governance, sustainability, higher education administration, and public policy. I am particularly interested in leveraging data-driven and computational approaches to address organisational, governance, and development challenges in emerging economies. My current research examines corporate governance and environmental performance in Nigeria’s oil and gas sector. Beyond academia, I am passionate about translating research and innovation into practical solutions that drive effectiveness and sustainable socio-economic development in Africa."
  website: https://sicss.io/2026/uyo/people  

