- name: 'Sarah Stone'
  website: https://www.linkedin.com/in/sarah-stone-5b3083158/
  image: /assets/images/2026/uw/speakers/sarah stone.jpg
  bio: "Dr. Sarah Stone is the Executive Director of the University of Washington eScience Institute, a campus hub for data-intensive discovery crossing all disciplinary fields. She is also Co-Director for UW's Scientific Software Engineering Center (SSEC) which develops open and reproducible software for research communities in collaboration with Schmidt Sciences. As a co-PI on NSF's CloudBank initiative she leads outreach and training, educating researchers about cloud computational resources. Stone is a co-founder and previous director of the UW Data Science for Social Good program (2015-2024). Stone's background is in biological oceanography where she studied zooplankton impacts on the ocean carbon cycle."

- name: 'Scott Henderson'
  website: https://scottyhq.github.io/
  image: /assets/images/2026/uw/speakers/scott.png
  bio: "I'm a research scientist in the Earth and Space Sciences Department at the University of Washington and Data Science Fellow at the eScience Institute. My research focuses on the application of satellite observations to understand and monitor terrestrial natural hazards, such as volcanic eruptions, landslides, and earthquakes. If I'm not considering the view from satellites then I am exploring on ground, whether in my own backyard or abroad."

- name: 'Benjamin Mako Hill'
  website: https://mako.cc/
  image: /assets/images/2026/uw/speakers/mako.jpg
  bio: "I am a social scientist and technologist. In both roles, I work to understand the social dynamics that shape online communities. My work focuses on communities engaged in the peer production of digital public goods free culture and free software like Wikipedia and Linux. For most of my life, I have also participated in these communities as an activist, contributor, and leader. I spend most of my time consuming, and increasingly often producing, academic articles, software, blog posts, essays, books and talks."

- name: 'Trey Causey'
  website: https://www.treycausey.com/
  image: /assets/images/2026/uw/speakers/trey.jpg
  bio: "I most recently led responsible AI efforts at Indeed where I supported our mission to help all people get jobs. We worked across the business to support the development and deployment of ML and AI models that increase fairness, reduce bias, and expand access to economic opportunity for hundreds of millions of job seekers every month. My team was interdisciplinary, cross-functional, and was tasked with building solutions and tools that enabled the responsible application of AI. We aimed to allow AI teams to move more quickly *and* more responsibly."

- name: 'Sasha Johfre'
  website: https://www.sashajohfre.com/
  image: /assets/images/2026/uw/speakers/sasha.jpg
  bio: "I am an Assistant Professor of Sociology and core faculty in the Center for Statistics and the Social Sciences at the University of Washington. I am also a faculty affiliate in the Center for Studies in Demography and Ecology and Science, Technology, and Society Studies at the University of Washington. My research considers the creation and consequences of conceptual categories, including ways that human difference (e.g. based on gender, race, age, etc.) is seen as real and natural. My overall goal is to create new conceptual and methodological tools that help people understand, interrogate, and intentionally engage in social processes. I am currently working on projects related to what I call \"Naturalness Dogma\"; age as a socially constructed system of inequality; and methods to more responsibly measure and interrogate social difference."

- name: 'Noah A. Smith'
  website: https://nasmith.github.io/
  image: /assets/images/2026/uw/speakers/noah.jpg
  bio: "Noah Smith is a computer scientist working in several fields of artificial intelligence research. He recently wrote Language Models: A Guide for the Perplexed, a general-audience tutorial, and he directs the OLMo open language modeling effort. He is the PI of the NSF- and NVIDIA-supported project Open Multimodal AI Infrastructure to Accelerate Science. Broadly, his research targets algorithms that process data encoding language, music, and more, to augment human capabilities. He also works on core problems of research methodology like evaluation. You can watch videos of some of his talks, read his papers, and learn about his research group, Noah's ARK. Smith is most proud of his mentoring accomplishments: as of 2025, he has graduated 32 Ph.D. students and mentored 18 postdocs, with 28 alumni now in faculty positions around the world. 23 of his undergraduate/masters mentees have gone on to Ph.D. programs. His group's alumni have started companies and are technological leaders both inside and outside the tech industry."

- name: 'Jian Yang'
  website: https://www.linkedin.com/in/jian-yang-marketuserresearch/
  image: 
  bio: "I thrive in creative, cross-disciplinary environments and work across organizational boundaries to surface the unspoken questions and assumptions that shape our products. I put people first, centering their needs, problems, goals, and aspirations. I'm energized by creating direct, tangible product impact and delivering holistic, AI-powered consumer experiences across apps and the web!"

- name: 'Jess Holbrook'
  website: https://www.linkedin.com/in/jessholbrook/
  image: /assets/images/2026/uw/speakers/jess.jpg
  bio: "Currently leading UX research for Microsoft AI. Early stage investor in AI, AI hardware ecosystems, climate, bio, and anything that seems like the world would be better with it in it. Previously led the Generative AI, Responsible AI, and data transparency UX research teams at Meta. At Google I was Head of UX for the Responsible AI and Human-centered Technology group. Before that, I founded and led of the People + AI Research team (PAIR) working on human-centered and inclusive approaches to AI. I led a team of UX Researchers, Interaction, Visual, and Motion Designers, Prototypers, and Program Managers in the Google Research (aka Google AI) group. We took AI and machine learning technologies, matched them with people's needs, and brought them to market through products like Google Clips and the Pixel phones. I was also the UX Lead for AIY Projects bringing AI to the maker community. Before that, I researched many of the Google Cloud Platform developer experiences including those around big data, data visualization, and developer productivity."

- name: 'Jon E. Froehlich'
  website: https://jonfroehlich.github.io/
  image: /assets/images/2026/uw/speakers/jon.jpg
  bio: "I'm Jon, a Professor in Human-Computer Interaction at UW's Allen School of Computer Science and Engineering where I work with an extraordinary set of students and collaborators on problems related to accessibility, urban informatics, environmental sustainability, and STE(A)M education. I am also a Visiting Faculty Researcher on the Society-Centered AI team at Google Research. At UW, I direct the Makeability Lab and am the Associate Director of CREATE (Center for Research and Education on Accessible Technology and Experiences), Associate Director of Tech Transfer and Outreach of PacTrans, and co-founder of Project Sidewalk, a web tool aimed at transforming how sidewalks are mapped, analyzed, and visualized using crowdsourcing+AI. I also serve as a Core Faculty Member in the Interdisciplinary PhD Program in Urban Design and Planning within the UW Graduate School. I was selected as a Sloan Fellow in 2016, the UW College of Engineering Outstanding Faculty in 2021, the PacTrans Outstanding Researcher in 2022, and for the SIGCHI Societal Impact Award in 2026. Our lab has accrued 25 Best Paper and Honorable Mention Awards at leading scientific venues in Human-Computer Interaction, including at: CHI, ASSETS, UIST, and IMWUT. In 2022, I was the General Chair for ASSETS'22, the premier ACM conference for research on the design, evaluation, use, and education related to computing for people with disabilities and older adults, where I spearheaded the first ever hybrid conference in ASSETS history and developed the new workshop track (both initiatives continue today). From 2021-2024, I was the Faculty Chair of UW's cross-disciplinary MHCI+D program."

- name: 'Riccardo Fogliato'
  website: https://ricfog.github.io/
  image: /assets/images/2026/uw/speakers/speakers-riccardo-fogliato.jpg
  bio: "I am a senior research scientist on the Responsible AI team at Microsoft Core AI, working on testing of LLM safety. Previously, I was an applied scientist on the Responsible AI team at AWS, where I worked on statistical methods for evaluating language and vision models. I received a PhD in Statistics from CMU under the supervision of Alexandra Chouldechova and Zachary Lipton. During the PhD, I interned at MSR with Besmira Nushi, Kori Inkpen, and Eric Horvitz. I also was a research fellow at the Partnership on AI where I worked with Alice Xiang. Before going to CMU, I studied at Collegio Carlo Alberto, at the Universities of Torino and Padova, and spent some time at ENS Cachan."

- name: 'Madeleine Daepp'
  website: https://www.madeleinedaepp.com/
  image: /assets/images/2026/uw/speakers/madeleine.jpg
  bio: "Dr. Madeleine I. G. Daepp is a senior researcher on the Special Projects team at Microsoft Research. Her research is characterized by multi-sectoral collaborations to solve problems in shared public space. Her research has been published across disciplines including urban planning, public health, and computer science.  As the token urban planning researcher at Microsoft Research, a key focus of her work is in bridging the divide between the promise of new technologies and data and the needs of communities. She holds a PhD from MIT, an MSc from the University of British Columbia - Vancouver, and a BA from Washington University in St. Louis."
