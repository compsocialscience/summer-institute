- name: "Isabelle Thiara"
  image: /assets/images/people-isabelle-thiara.jpg
  bio: "Isabelle is a third-year PhD student in the Department of Statistics at UW. She is interested in the intersection of statistics and global health. Her research focuses on building dynamic, temporal networks to characterize human-livestock contact structure and map zoonotic disease transmission."
  website: https://stat.uw.edu/people/isabelle-thiara

- name: "Mark Nepf"
  image: /assets/images/2026/uw/MarkNepf.jpg
  bio: "Mark is a PhD student at the University of Washington's Evans School of Public Policy & Governance, where his research connects environmental justice and marine policy. Mark's work explores collaborative governance frameworks for estuary management, leveraging spatial data to understand barriers to public participation."
  website: https://www.linkedin.com/in/mark-nepf/
