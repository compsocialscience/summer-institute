- name: "Letao Wang"
  image: /assets/images/2026/uw/participants/IMG_0941 - letao.HEIC
  bio: "Letao Wang is a PhD student in Sociology at Washington University in St. Louis. Her current research examines inequality in U.S. labor markets, with particular attention to non-material dimensions of work, such as status and meaning, and to its broader social consequences."
  website: https://www.google.com

- name: "Ris Swank"
  image: /assets/images/2026/uw/participants/Ris-1 - Ris Swank.jpeg
  bio: "I am a PhD candidate in Political Science at Washington State University. My research considers the relationship between conspiracy beliefs and support for political violence in American politics. I explore this topic from psychological and behavioral perspectives in tandem with broader informational environments."
  website: https://www.google.com