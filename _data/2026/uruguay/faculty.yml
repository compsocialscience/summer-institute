- name: Elina Gómez
  image: /assets/images/elina_2.jpg
  bio: Elina Gómez is a Sociologist, Master in Contemporary Latin American Studies and PhD candidate in Sociology at the Faculty of Social Sciences of the University of the Republic. She is a professor and researcher at the Methods and Data Access Unit (UMAD) of the Faculty of Social Sciences of the University of the Republic. Her work focuses on the field of computational social sciences and massive text processing. She teaches undergraduate and graduate courses in programming and text analysis with R. 
  website: https://elinagomez.com/

- name: Fabricio Carneiro
  image: /assets/images/Fabricio_Carneiro.jpg
  bio: Fabricio Carneiro is a Political Scientist, Master in Political Science by the Universidad Torcuato Di Tella of Buenos Aires and PhD candidate in Political Science by the same University. His research agenda is focused on issues of comparative political economy and comparative politics, in particular wage bargaining models, social policies and redistributive policies. 
  website: https://scholar.google.es/citations?user=mdfwhS4AAAAJ&hl=es&oi=ao
  
- name: Malena Montano 
  image: /assets/images/2026/uruguay/malenamontano.jpg
  bio: Malena Montano is a PhD candidate in Social Sciences (Economic History) at the Faculty of Social Sciences of the Universidad de la República (Udelar), where she works as a research assistant, and holds a Master's in Contemporary Latin American Studies. She also holds a University Diploma in Computational Social Sciences and Digital Humanities from IDAES-UNSAM, and her research focuses on gender, labor markets and development in the long run, an area in which she seeks to integrate computational tools such as text analysis, survey harmonization, comparative analysis and data structuring.
  website: https://cienciassociales.edu.uy/unidad-multidisciplinaria/prides/equipo-docente/malena-montano/

  
- name: Mariana Seco 
  image: /assets/images/2026/uruguay/marianaseco.jpg
  bio: Mariana Seco is a sociologist and a master’s student in Sociology at the Faculty of Social Sciences, University of the Republic (Udelar). She is a research assistant at the Institute for Research on Social Justice and Inequalities (IJD), where she is a member of the Center for Socioeconomic and Behavioral Information (CISCo). Her research interests lie in the sociology of crime, illicit economies, crimes of the powerful, social justice, and social inequalities
  website: https://exportcvuy.anii.org.uy/cv/?f9637f87dff2a98326781056c11f1d31

- name: Esteban García 
  image: /assets/images/2026/uruguay/estebangarcia.jpg
  bio: Esteban García is a doctoral student in the Political Science PhD Program at Universidad Torcuato Di Tella and holds a Bachelor's and a Master's degree in Political Science from Universidad de la República (UdelaR). He currently works as a researcher at the Unit for Methods and Data Access (UMAD), Faculty of Social Sciences, UdelaR, with research lines in political history and parliamentary studies.
  website: https://exportcvuy.anii.org.uy/cv/?f9637f87dff2a98326781056c11f1d31

